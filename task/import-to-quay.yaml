---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  annotations:
    tekton.dev/pipelines.minVersion: 0.12.1
    tekton.dev/tags: rpm-build
  name: import-to-quay
spec:
  description: Import built results into quay.io
  params:
    - description: Source Repository URL
      name: git-url
      type: string
    - name: revision
      description: Revision of the Source Repository
      type: string
    - name: ociStorage
      type: string
    - description: The name of the package we build
      name: package-name
      type: string
    - name: test-suffix
      type: string
      description: |
        Test-only.  If testing the pipeline, we still want to test the upload to
        quay.io, but we don't want to mix-up with the real "production" uploads.
      default: ""
    - name: start-time
      description: Store pipeline start time
      default: ""
      type: string
    - name: pipelinerun-id
      description: PipelineRun ID (namespace/name)
      default: ""
      type: string
    - description: The Trusted Artifact URI pointing to the i686 build output
      name: i686-artifact
      type: string
    - description: The Trusted Artifact URI pointing to the x86_64 build output
      name: x86_64-artifact
      type: string
    - description: The Trusted Artifact URI pointing to the aarch64 build output
      name: aarch64-artifact
      type: string
    - description: The Trusted Artifact URI pointing to the s390x build output
      name: s390x-artifact
      type: string
    - description: The Trusted Artifact URI pointing to the ppc64le build output
      name: ppc64le-artifact
      type: string
    - description: RPM Build environment OCI image to run scripts in
      name: script-environment-image
      type: string
    - name: side-tag
      description: Pulp RPM repository name (side tag) to upload into
      type: string
      default: ""
  results:
    - name: IMAGE_URL
      description: Location of build artifact
    - name: IMAGE_DIGEST
      description: Build artifact digest
    - name: NVR
      description: name-version-release of built package
    - name: SBOM_BLOB_URL
      description: SPDX SBOM
      type: string
    - name: PULP-IMAGE_URL
      description: Location of Pulp build artifact
    - name: PULP-IMAGE_DIGEST
      description: Pulp build artifact digest
  stepTemplate:
    volumeMounts:
      - mountPath: /var/workdir/results
        name: workdir
  steps:
    - name: use-trusted-artifact-x86-64
      image: quay.io/konflux-ci/build-trusted-artifacts:latest@sha256:0388f83b0a0f02e1b814f62e660a68c56f283fe3092371d00bf5ce743f53be2f
      args:
        - use
        - $(params.x86_64-artifact)=/var/workdir/results
    - name: use-trusted-artifact-aarch64
      image: quay.io/konflux-ci/build-trusted-artifacts:latest@sha256:0388f83b0a0f02e1b814f62e660a68c56f283fe3092371d00bf5ce743f53be2f
      args:
        - use
        - $(params.aarch64-artifact)=/var/workdir/results
    - name: use-trusted-artifact-s390x
      image: quay.io/konflux-ci/build-trusted-artifacts:latest@sha256:0388f83b0a0f02e1b814f62e660a68c56f283fe3092371d00bf5ce743f53be2f
      args:
        - use
        - $(params.s390x-artifact)=/var/workdir/results
    - name: use-trusted-artifact-ppc64le
      image: quay.io/konflux-ci/build-trusted-artifacts:latest@sha256:0388f83b0a0f02e1b814f62e660a68c56f283fe3092371d00bf5ce743f53be2f
      args:
        - use
        - $(params.ppc64le-artifact)=/var/workdir/results
    - name: use-trusted-artifact-i686
      image: quay.io/redhat-appstudio/build-trusted-artifacts:latest@sha256:9b180776a41d9a22a1c51539f1647c60defbbd55b44bbebdd4130e33512d8b0d
      args:
        - use
        - $(params.i686-artifact)=/var/workdir/results
    - name: gather-rpms
      image: $(params.script-environment-image)
      script: |
        #!/usr/bin/env bash
        set -e
        cd /var/workdir/results
        /usr/local/bin/gather_rpms.py \
            --source-url git+$(params.git-url)#$(params.revision) \
            --start-time $(params.start-time) \
            --end-time `date "+%s"` \
            --pipeline-id "$(params.pipelinerun-id)"
        echo "Gathered `ls oras-staging | wc -l` files for upload"

    - name: push-to-quay-select-auth
      image: quay.io/konflux-ci/oras:latest@sha256:d126f98e16bfad71aab782eb212a5be701e2cde915d294a7bd6423a4ab448705
      script: |
        #!/usr/bin/env bash
        set -e

        cd /var/workdir/results

        # Get NVR from any SRPM
        NVR=$(<nvr.log)

        IMAGE_URL="$(params.ociStorage)"

        echo "Selecting auth for $IMAGE_URL"
        select-oci-auth $IMAGE_URL > $HOME/auth.json

        echo "Pushing to: $IMAGE_URL"
        cd oras-staging
        # TODO: rewrite to push/attach + xargs for bigger builds (texlive has ~580 rpms)
        oras push \
             --registry-config "$HOME/auth.json" \
             --artifact-type application/vnd.rpm.build.v0 \
             --annotation quay.expires-after=14d \
             $IMAGE_URL \
             `cat ../oras-push-list.txt` | tee /tmp/oras.log

        grep "Digest:" /tmp/oras.log | awk '{print $2}' | tr -d '\n' > $(results.IMAGE_DIGEST.path)
        echo -n $IMAGE_URL > $(results.IMAGE_URL.path)
        echo -n $NVR > $(results.NVR.path)
    - name: explode-srpm
      image: $(params.script-environment-image)
      workingDir: /var/workdir/results/oras-staging
      script: |
        #!/usr/bin/env bash

        export PS4='+ $(date "+%Y-%m-%d %H:%M:%S") '
        set -x
        SRCDIR=$(pwd)
        TMPDIR=./syft-extracted
        mkdir $TMPDIR

        cd $TMPDIR || exit 1
        for rpm in $SRCDIR/*.src.rpm ; do
          echo "Extracting srpm $rpm"
          rpm_fn=$(basename "$rpm")
          cp "$rpm" .
          rpm2archive -n "$rpm_fn" | tar -x
          rm "$rpm_fn"
        done

        echo "Decompressing found archives"
        ( # limit the scope of nullglob
          shopt -s nullglob
          for tarball in *.tar* *.tg* ; do
            case $tarball in
              *sig|*asc) continue ;;
            esac
            tar -vxf "$tarball"
          done
        )
        true archive explosion finished
    - name: run-syft
      image: registry.access.redhat.com/rh-syft-tech-preview/syft-rhel9:1.29.0@sha256:dc0da6b4448428e625271b542cc029ab03de92f75ea50d6d63b1d088d20bbd28
      workingDir: /var/workdir/results/oras-staging
      script: |
        syft ./syft-extracted -o spdx-json > syft-sbom.json
    - name: merge-syft-sbom
      image: $(params.script-environment-image)
      workingDir: /var/workdir/results/oras-staging
      script: |
        #!/bin/bash
        export PS4='+ $(date "+%Y-%m-%d %H:%M:%S") '
        set -x
        find . | sort
        ARGS=(--rpm-dir . --syft-sbom syft-sbom.json --sbom-merged sbom-merged.json)
        if [ -f ancestors.json ]; then
          ARGS+=(--source-data ancestors.json)
        else
          echo "WARNING: ancestors.json not found in oras-staging, skipping source artifacts in SBOM" >&2
        fi
        merge_syft_sbom.py "${ARGS[@]}"
    - name: show-sbom
      image: quay.io/konflux-ci/appstudio-utils:ab6b0b8e40e440158e7288c73aff1cf83a2cc8a9@sha256:24179f0efd06c65d16868c2d7eb82573cce8e43533de6cea14fec3b7446e0b14
      workingDir: /var/workdir/results/oras-staging
      script: |
        #!/usr/bin/env bash
        jq . sbom-merged.json
    - name: push-to-pulp
      image: quay.io/redhat-user-workloads/artifact-storage-tenant/tooling/pulp-tool-container:latest@sha256:583e721a97c0d24b5d71eb23e2a0dc5f1622ebacc63a9a8ab0fb702780f21bbd
      script: |
        #!/usr/bin/env bash
        set -e
        : > "$(results.PULP-IMAGE_URL.path)"
        : > "$(results.PULP-IMAGE_DIGEST.path)"

        if [ ! -f /pulp-access/cli.toml ]; then
          echo "Pulp config file does not exist; skipping push and writing empty Pulp result files"
          exit 0
        fi

        # Standard upload to build-scoped Pulp repos
        pulp-tool --config /pulp-access/cli.toml \
          --build-id "$(params.pipelinerun-id)" \
          --namespace "$(context.taskRun.namespace)" \
          upload \
          --parent-package "$(params.package-name)" \
          --rpm-path "/var/workdir/results" \
          --sbom-path "/var/workdir/results/oras-staging/sbom-merged.json" \
          --artifact-results "$(results.PULP-IMAGE_URL.path)","$(results.PULP-IMAGE_DIGEST.path)"
      volumeMounts:
        - mountPath: /pulp-access
          readOnly: true
          name: pulp-access-credentials
    - name: copy-to-side-tag
      image: quay.io/redhat-user-workloads/artifact-storage-tenant/tooling/pulp-tool-container:latest@sha256:583e721a97c0d24b5d71eb23e2a0dc5f1622ebacc63a9a8ab0fb702780f21bbd
      script: |
        #!/usr/bin/env python3
        """Copy RPM content from the build repo to the side tag repo."""
        import glob
        import hashlib
        import json
        import os
        import sys
        import time

        import httpx

        SIDE_TAG = "$(params.side-tag)"
        if not SIDE_TAG:
            print("No side tag specified, skipping")
            sys.exit(0)

        # Parse Pulp config
        config = {}
        config_path = "/pulp-access/cli.toml"
        if not os.path.exists(config_path):
            print("No Pulp credentials, skipping side tag copy")
            sys.exit(0)

        with open(config_path) as f:
            for line in f:
                line = line.strip()
                if "=" in line and not line.startswith("["):
                    key, val = line.split("=", 1)
                    key = key.strip()
                    val = val.strip().strip('"')
                    config[key] = val

        base_url = config["base_url"]
        domain = config["domain"]
        username = config["username"]
        password = config["password"]
        api = f"{base_url}/api/pulp/{domain}/api/v3"
        auth = (username, password)

        client = httpx.Client(auth=auth, timeout=60)

        def wait_task(task_href, ignore_duplicate=False):
            """Wait for an async Pulp task to complete."""
            url = f"{base_url}{task_href}" if task_href.startswith("/") else task_href
            for _ in range(60):
                r = client.get(url)
                r.raise_for_status()
                data = r.json()
                state = data["state"]
                if state == "completed":
                    return data
                if state == "failed":
                    err = data.get("error", {})
                    if ignore_duplicate and err.get("error_code") == "PLP0022":
                        print("  (duplicate content already in repo, ignoring)")
                        return data
                    print(f"Task failed: {data}", file=sys.stderr)
                    sys.exit(1)
                time.sleep(2)
            print("Task timed out", file=sys.stderr)
            sys.exit(1)

        # Find the side tag repo
        r = client.get(f"{api}/repositories/rpm/rpm/", params={"name": SIDE_TAG})
        r.raise_for_status()
        repos = r.json()["results"]
        if not repos:
            print(f"ERROR: Side tag repo '{SIDE_TAG}' not found")
            sys.exit(1)
        sidetag_repo_href = repos[0]["pulp_href"]
        print(f"Side tag repo: {sidetag_repo_href}")

        # Find all RPM files in the results directory
        rpm_files = []
        for pattern in ["/var/workdir/results/*/*.rpm", "/var/workdir/results/*.rpm"]:
            rpm_files.extend(glob.glob(pattern))

        if not rpm_files:
            print("No RPM files found, skipping side tag copy")
            sys.exit(0)

        print(f"Found {len(rpm_files)} RPM files to add to side tag")

        # Deduplicate RPM files by SHA256 (same RPM may appear in
        # multiple arch directories).
        seen_sha256 = {}
        for rpm_file in rpm_files:
            sha256 = hashlib.sha256(open(rpm_file, "rb").read()).hexdigest()
            if sha256 not in seen_sha256:
                seen_sha256[sha256] = rpm_file

        print(f"  {len(seen_sha256)} unique RPMs (deduplicated from {len(rpm_files)} files)")

        # Find content units for each unique RPM, deduplicating by NEVRA
        # (name-epoch-version-release-arch) to avoid Pulp PLP0022 errors.
        content_hrefs = {}  # NEVRA -> href (keeps last one per NEVRA)
        for sha256, rpm_file in seen_sha256.items():
            basename = os.path.basename(rpm_file)

            # Find existing content unit by SHA256
            r = client.get(f"{api}/content/rpm/packages/", params={
                "sha256": sha256,
                "fields": "pulp_href,name,epoch,version,release,arch",
            })
            r.raise_for_status()
            existing_content = r.json()["results"]

            if existing_content:
                pkg = existing_content[0]
                nevra = f"{pkg['name']}-{pkg['epoch']}:{pkg['version']}-{pkg['release']}.{pkg['arch']}"
                if nevra not in content_hrefs:
                    content_hrefs[nevra] = pkg["pulp_href"]
                    print(f"  Found: {basename} ({nevra})")
                else:
                    print(f"  Skip duplicate NEVRA: {basename}")
            else:
                # Need to upload artifact first
                r_art = client.get(f"{api}/artifacts/", params={"sha256": sha256})
                r_art.raise_for_status()
                existing_art = r_art.json()["results"]

                if existing_art:
                    artifact_href = existing_art[0]["pulp_href"]
                else:
                    with open(rpm_file, "rb") as f:
                        r_art = client.post(f"{api}/artifacts/", files={"file": (basename, f)})
                    r_art.raise_for_status()
                    artifact_href = r_art.json()["pulp_href"]

                r = client.post(f"{api}/content/rpm/packages/", data={
                    "artifact": artifact_href,
                    "relative_path": f"Packages/{basename}",
                })
                r.raise_for_status()
                resp = r.json()
                href = None
                if "task" in resp:
                    task = wait_task(resp["task"])
                    for resource in task.get("created_resources", []):
                        if "/content/rpm/packages/" in resource:
                            href = resource
                elif "pulp_href" in resp:
                    href = resp["pulp_href"]
                if href:
                    # Fetch NEVRA for dedup
                    r2 = client.get(f"{base_url}{href}", params={"fields": "name,epoch,version,release,arch"})
                    r2.raise_for_status()
                    pkg = r2.json()
                    nevra = f"{pkg['name']}-{pkg['epoch']}:{pkg['version']}-{pkg['release']}.{pkg['arch']}"
                    content_hrefs[nevra] = href
                print(f"  Created: {basename}")

        if not content_hrefs:
            print("No content units created, skipping modify")
            sys.exit(0)

        # Add all unique content units to the side tag repo (one per NEVRA)
        content_list = sorted(content_hrefs.values())
        print(f"Adding {len(content_list)} unique content units ({len(content_hrefs)} NEVRAs) to side tag '{SIDE_TAG}'")
        r = client.post(f"{base_url}{sidetag_repo_href}modify/", json={
            "add_content_units": content_list,
        })
        r.raise_for_status()
        resp = r.json()
        if "task" in resp:
            wait_task(resp["task"], ignore_duplicate=True)

        print(f"Successfully copied {len(content_hrefs)} RPMs to side tag '{SIDE_TAG}'")
      volumeMounts:
        - mountPath: /pulp-access
          readOnly: true
          name: pulp-access-credentials
    - name: upload-sbom-to-quay
      image: registry.redhat.io/rhtas/cosign-rhel9:1.1.1@sha256:3cd261cd4fed03688c6fd3c6161ae1ec69e908bbb6593ec279415414c7422535
      script: |
        #!/usr/bin/env bash
        cosign \
         attach sbom \
         --sbom results/oras-staging/sbom-merged.json \
         --type spdx \
         $(cat $(results.IMAGE_URL.path))@$(cat $(results.IMAGE_DIGEST.path))
      workingDir: /var/workdir
    - name: report-sbom-url
      image: quay.io/konflux-ci/yq:latest@sha256:e8bc7ee6bb0c66f6673d1150d8dcb0b28175905c8c0ba5263b75a0a744bfc6d2
      workingDir: /var/workdir/results/oras-staging
      script: |
        #!/usr/bin/env bash
        set -e
        IMAGE_URL=$(cat $(results.IMAGE_URL.path))
        REPO=${IMAGE_URL%:*}
        echo "Found that ${REPO} is the repository for ${IMAGE_URL}"
        SBOM_DIGEST=$(sha256sum sbom-merged.json | awk '{ print $1 }')
        echo "Found that ${SBOM_DIGEST} is the SBOM digest"
        echo -n "${REPO}@sha256:${SBOM_DIGEST}" | tee $(results.SBOM_BLOB_URL.path)
  volumes:
    - name: pulp-access-credentials
      secret:
        optional: true
        secretName: pulp-access
    - name: workdir
      emptyDir: {}
