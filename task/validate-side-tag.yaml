---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  annotations:
    tekton.dev/pipelines.minVersion: 0.12.1
    tekton.dev/tags: rpm-build
  name: validate-side-tag
spec:
  description: >
    Validates that the target Pulp RPM repository (side tag) exists and is
    accessible before the build proceeds.  When no side tag is specified,
    this task is a no-op.
  params:
    - name: side-tag
      description: >
        Name of a Pulp RPM repository (side tag) to validate.
        When empty, validation is skipped.
      type: string
      default: ""
  results:
    - name: side-tag-validated
      description: '"true" if a side tag was validated, "false" if skipped'
    - name: side-tag-repo-url
      description: >
        DNF baseurl for the side tag's Pulp distribution.  Empty when no side
        tag is specified.  Used by prepare-mock-config to inject the side tag
        as an extra repo so builds can use packages already in the side tag.
  steps:
    - name: validate
      image: registry.access.redhat.com/ubi9-minimal:latest
      script: |
        #!/usr/bin/env bash
        set -e

        SIDE_TAG="$(params.side-tag)"

        if [ -z "$SIDE_TAG" ]; then
          echo "No side tag specified, skipping validation"
          echo -n "false" > "$(results.side-tag-validated.path)"
          echo -n "" > "$(results.side-tag-repo-url.path)"
          exit 0
        fi

        echo "Validating side tag repository: $SIDE_TAG"

        if [ ! -f /pulp-access/cli.toml ]; then
          echo "ERROR: side-tag '$SIDE_TAG' specified but no Pulp credentials found (pulp-access secret missing)"
          exit 1
        fi

        # Parse credentials from cli.toml
        BASE_URL=$(grep '^base_url' /pulp-access/cli.toml | sed 's/.*= *"//' | sed 's/".*//')
        USERNAME=$(grep '^username' /pulp-access/cli.toml | sed 's/.*= *"//' | sed 's/".*//')
        PASSWORD=$(grep '^password' /pulp-access/cli.toml | sed 's/.*= *"//' | sed 's/".*//')
        DOMAIN=$(grep '^domain' /pulp-access/cli.toml | sed 's/.*= *"//' | sed 's/".*//')

        # Query distribution by name
        DIST_URL="${BASE_URL}/api/pulp/${DOMAIN}/api/v3/distributions/rpm/rpm/?name=${SIDE_TAG}"
        echo "Querying: $DIST_URL"

        RESPONSE=$(curl -sf -u "${USERNAME}:${PASSWORD}" "$DIST_URL")
        COUNT=$(echo "$RESPONSE" | python3 -c "import json,sys; print(json.load(sys.stdin)['count'])" 2>/dev/null || echo "0")

        if [ "$COUNT" = "0" ]; then
          echo "ERROR: Side tag distribution '$SIDE_TAG' not found in Pulp domain '$DOMAIN'"
          exit 1
        fi

        REPO_URL=$(echo "$RESPONSE" | python3 -c "import json,sys; print(json.load(sys.stdin)['results'][0]['base_url'])")

        echo "Side tag repository '$SIDE_TAG' validated successfully"
        echo "Distribution URL: $REPO_URL"
        echo -n "true" > "$(results.side-tag-validated.path)"
        echo -n "$REPO_URL" > "$(results.side-tag-repo-url.path)"
      volumeMounts:
        - mountPath: /pulp-access
          readOnly: true
          name: pulp-access-credentials
  volumes:
    - name: pulp-access-credentials
      secret:
        optional: true
        secretName: pulp-access
